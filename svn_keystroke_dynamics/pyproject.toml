[tool.poetry]
name = "keystroke-dynamics-auth"
version = "0.1.0"
description = "SVM 기반 키스트로크 다이내믹스 인증 시스템"
authors = ["Junnie <lommy101@gmail.com>"]
readme = "README.md"
packages = [{include = "keystroke_dynamics_auth"}]

[tool.poetry.dependencies]
python = ">=3.8,<4.0"
numpy = ">=1.19.0"
scikit-learn = ">=0.24.0"
matplotlib = ">=3.3.0"
pandas = ">=1.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
black = "^23.0.0"
isort = "^5.12.0"

[tool.poetry.scripts]
keystroke-auth = "keystroke_dynamics_auth.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
